<section class="appointment-section">


<h1>Book Your Appointment</h1>



<form id="appointmentForm">


<label>
Patient Name
</label>

<input 
type="text" 
id="name"
placeholder="Enter your name"
>



<label>
Email Address
</label>

<input 
type="email" 
id="email"
placeholder="Enter your email"
>




<label>
Phone Number
</label>

<input 
type="tel"
id="phone"
placeholder="Enter phone number"
>




<label>
Select Doctor
</label>


<select id="doctor">


<option value="">
Choose Doctor
</option>


<option>
Dr. Fathima Nuha - Cardiologist
</option>


<option>
Dr. Mohamed Nabreis - Neurologist
</option>


<option>
Dr. Nabreis Nuha - Paediatrician
</option>


</select>




<label>
Appointment Date
</label>


<input 
type="date"
id="date"
>




<button type="submit">

Book Appointment

</button>



<p id="message"></p>



</form>


</section>




<script src="js/script.js"></script>
